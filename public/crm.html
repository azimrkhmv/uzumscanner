<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uzum — Top Shops</title>
  <style>
    :root { --uzum: #7000ff; --bg: #f4f4f8; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: #1f2026; padding: 32px; }
    .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    h1 { margin: 0; font-size: 22px; }
    .links a { text-decoration: none; color: var(--uzum); font-weight: 600; font-size: 14px; margin-left: 16px; }
    .sub { color: #6b6b76; font-size: 13px; margin-bottom: 20px; }
    .totals { display: flex; gap: 14px; margin-bottom: 20px; }
    .tcard { background: #fff; border-radius: 12px; padding: 16px 20px; box-shadow: 0 4px 18px rgba(0,0,0,.06); }
    .tcard .label { font-size: 12px; color: #6b6b76; }
    .tcard .value { font-size: 26px; font-weight: 700; margin-top: 2px; }
    .tcard.hl .value { color: var(--uzum); }
    table { width: 100%; border-collapse: collapse; background: #fff;
      border-radius: 12px; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.06); }
    th, td { text-align: left; padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #eee; }
    th { background: #faf8ff; color: #555; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
    tr:last-child td { border-bottom: 0; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .rank { color: #999; width: 36px; }
    .empty { padding: 40px; text-align: center; color: #888; }
    .shop a { color: var(--uzum); text-decoration: none; font-weight: 600; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #eee; color: #666; margin-left: 6px; }
    tr.row:hover { background: #faf9ff; }
    td.prod a { color: var(--uzum); text-decoration: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="head">
    <h1>Top Shops</h1>
    <div class="links">
      <a href="/">Analyze</a>
      <a href="/products.html">All products →</a>
    </div>
  </div>
  <div class="totals">
    <div class="tcard"><div class="label">Shops</div><div class="value" id="tShops">—</div></div>
    <div class="tcard hl"><div class="label">Total products (all shops)</div><div class="value" id="tProducts">—</div></div>
  </div>
  <table>
    <thead>
      <tr>
        <th class="rank">#</th><th>Shop</th><th class="num">Products</th>
        <th class="num">Rating</th><th class="num">Orders</th><th class="num">Quote (so'm)</th><th>Catalog</th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
  </table>

  <script>
    const fmt = (n) => (n == null ? '—' : Number(n).toLocaleString('en-US'));
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let PRICE_PER_IMAGE = 5000; // overwritten from /api/config

    async function load() {
      try { PRICE_PER_IMAGE = (await (await fetch('/api/config')).json()).pricePerImage ?? PRICE_PER_IMAGE; } catch {}
      const data = await (await fetch('/api/shops')).json();
      const tbody = document.getElementById('rows');
      const shops = data.shops || [];
      const totalProducts = shops.reduce((a, s) => a + (s.last_count || 0), 0);
      document.getElementById('tShops').textContent = fmt(shops.length);
      document.getElementById('tProducts').textContent = fmt(totalProducts);

      if (!shops.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">No shops yet — run <code>npm run scan</code>.</td></tr>';
        return;
      }
      tbody.innerHTML = '';
      shops.forEach((s, i) => {
        const tr = document.createElement('tr');
        tr.className = 'row';
        const url = 'https://uzum.uz/uz/seller/' + encodeURIComponent(s.slug || '');
        const quote = (s.last_count || 0) * PRICE_PER_IMAGE;
        tr.innerHTML = `
          <td class="rank">${i + 1}</td>
          <td class="shop"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(s.title)}</a><span class="pill">#${s.shop_id}</span></td>
          <td class="num">${fmt(s.last_count)}</td>
          <td class="num">${s.rating != null ? s.rating + ' ★' : '—'}</td>
          <td class="num">${fmt(s.orders)}</td>
          <td class="num">${fmt(quote)}</td>
          <td class="prod"><a href="/products.html?shop=${s.shop_id}">View products →</a></td>`;
        tbody.appendChild(tr);
      });
    }
    load();
  </script>
</body>
</html>
